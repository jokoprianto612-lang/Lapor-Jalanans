services:
  - type: web
    name: lapor-jalan-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lapor-jalan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://frontend-9fa1brwal-okongzincs-projects.vercel.app
      - key: LLM_API_ENDPOINT
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: VISION_API_ENDPOINT
        sync: false
      - key: VISION_API_KEY
        sync: false

databases:
  - name: lapor-jalan-db
    plan: free
    databaseName: lapor_jalan
    user: lapor_jalan_user
